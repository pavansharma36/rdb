name: Publish desktop app

# Build the Tauri desktop app for macOS, Linux, and Windows and publish the
# installers/bundles to a GitHub release. The plugin sidecars are published
# separately by publish-plugins.yml and installed in-app at runtime.
#
# Two modes:
#   - push to master  -> nightly: rolling `latest` prerelease,
#                        version `<major>.<minor>.<commit-count>`.
#   - push a `v*` tag -> stable: release at the tag (e.g. v0.2.0),
#                        version taken from the tag.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-app-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/master' }}

permissions:
  contents: write

jobs:
  cleanup:
    name: cleanup nightly release
    runs-on: ubuntu-latest
    if: |
      github.ref_type != 'tag'
      && !contains(github.event.head_commit.message, '[skip ci]')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove existing assets from latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          
          gh release view latest
  
          if gh release view latest >/dev/null 2>&1; then
            echo "Cleaning existing assets from latest release..."
  
            gh release view latest --json assets \
              --jq '.assets[].name' | while read -r asset; do
                [ -n "$asset" ] || continue
                echo "Deleting asset: $asset"
                gh release delete-asset latest "$asset" --yes
              done
          else
            echo "latest release does not exist yet"
          fi

  build:
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: cleanup
    if: |
      always() && !cancelled() &&
      (github.ref_type == 'tag' || !contains(github.event.head_commit.message, '[skip ci]'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14   # Apple Silicon (arm64)
            rust-target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
#          - os: macos-14   # Intel (x86_64), cross-compiled on arm64 — macos-13 Intel runners are scarce
#            rust-target: x86_64-apple-darwin
#            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
#          - os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git rev-list --count` is accurate

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}-${{ matrix.rust-target }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            build-essential \
            file \
            wget

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Auto-version. On a tag, use the tag's version. On master, keep
      # major.minor from tauri.conf.json and set the patch to the git commit
      # count, so each push produces a higher version shared with the plugins.
      # Stamped only for this build, not committed back, to avoid a
      # push -> build -> push loop.
      - name: Stamp version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION=""   # empty -> derive major.minor.count in node
          fi
          export COUNT=$(git rev-list --count HEAD)
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            let v = process.env.VERSION;
            if (!v) {
              const [maj, min, patch] = c.version.split(".");
              v = `${maj}.${min}.${patch}-nightly.${process.env.COUNT}`;
            }
            c.version = v;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
            console.log("Stamped version", c.version);
          '

      # Decide the release tag/name/prerelease flag from the trigger.
      - name: Release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=rdb desktop ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=rdb desktop (nightly)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      # tauri-action runs the beforeBuildCommand (npm run build) to produce the
      # frontend, builds the app, then uploads the bundles to the release for
      # `tagName`, creating/updating it as needed.
      - name: Build and publish app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Stamp the build's release channel so the app knows whether to track
          # nightly or stable plugin releases (read via option_env! in the host).
          RDB_RELEASE_CHANNEL: ${{ github.ref_type == 'tag' && 'stable' || 'nightly' }}
          # Sign the updater artifacts so the in-app self-updater can verify
          # them. tauri-action then generates + uploads latest.json to the
          # release. Set these as repo secrets (private key from
          # `tauri signer generate`).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: ${{ steps.meta.outputs.name }}
          releaseBody: "Desktop build from ${{ github.sha }}."
          prerelease: ${{ steps.meta.outputs.prerelease }}
          args: ${{ matrix.args }}

  finalize:
    name: finalize release
    needs: build
    if: |
      always() &&
      github.ref_type == 'tag' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Commit version change back to master
        shell: bash
        run: |
          set -euo pipefail
          
          export VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r maj min pat <<< "$VERSION"
          export VERSION="${maj}.${min}.${(pat + 1)}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin master
          git checkout master
          git pull --ff-only origin master
          
          # Update tauri.conf.json to the released version.
          # If checkout got the pre-release version, stamp it again.
          
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          '
          
          git add src-tauri/tauri.conf.json
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: update version to ${VERSION} [skip ci]"
            git push origin master
          else
            echo "No version changes to commit"
          fi
