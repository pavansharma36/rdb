[workspace]
resolver = "2"
members = [
    "crates/rdb-core",
    "crates/rdb-plugin-runtime",
    "crates/rdb-rdbms-common",
    "crates/rdb-filemanager-common",
    "crates/plugins/postgres",
    "crates/plugins/mongodb",
    "crates/plugins/rabbitmq",
    "crates/plugins/ssh",
    "crates/plugins/sftp",
    "crates/plugins/snowflake",
    "crates/plugins/mysql",
    "crates/plugins/mssql",
    "crates/plugins/s3",
    "crates/plugins/curlui",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
repository = "https://github.com/pavansharma36/rdb"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

rdb-core = { path = "crates/rdb-core" }
rdb-plugin-runtime = { path = "crates/rdb-plugin-runtime" }
rdb-rdbms-common = { path = "crates/rdb-rdbms-common" }
rdb-filemanager-common = { path = "crates/rdb-filemanager-common" }
rdb-plugin-postgres = { path = "crates/plugins/postgres" }
rdb-plugin-mongodb = { path = "crates/plugins/mongodb" }
rdb-plugin-rabbitmq = { path = "crates/plugins/rabbitmq" }
rdb-plugin-snowflake = { path = "crates/plugins/snowflake" }
rdb-plugin-mysql = { path = "crates/plugins/mysql" }
rdb-plugin-mssql = { path = "crates/plugins/mssql" }
rdb-plugin-s3 = { path = "crates/plugins/s3" }
rdb-plugin-curlui = { path = "crates/plugins/curlui" }
