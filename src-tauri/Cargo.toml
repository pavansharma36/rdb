[package]
name = "rdb-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RDB desktop client (Tauri host)"

[lib]
name = "rdb_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.11"
url = "2"

rdb-core.workspace = true

# Self-update is desktop-only (no mobile target).
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Used to disable macOS system text substitutions (auto-capitalize, smart
# quotes/dashes) that corrupt typed input inside the WebView.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults"] }
