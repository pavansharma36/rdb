[package]
name = "rdb-plugin-mongodb"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rdb-core.workspace = true
rdb-plugin-runtime.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
mongodb = { version = "3", default-features = false, features = ["rustls-tls", "bson-3", "compat-3-3-0"] }
futures-util = "0.3"
bson = { version = "3", features = ["serde", "serde_json-1"] }
